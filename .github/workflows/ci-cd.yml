name: Java 21 Spring Boot 3 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Test & Dynamic Tagging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Unit Tests (JUnit 5)
        run: mvn clean test

      - name: Package Spring Boot Executable JAR
        run: mvn clean package -DskipTests

      - name: Automated Dynamic Tagging & GitHub Sync
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v1.0.1-build-$(date +'%Y%m%d%H%M%S')"
          echo "Generated automated dynamic tag: ${TAG_NAME}"
          git tag -a "${TAG_NAME}" -m "GitHub Actions Build Pass: ${TAG_NAME}"
          git push origin "${TAG_NAME}" || true
