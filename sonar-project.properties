# SonarQube Quality Gate Configuration
# Project: 毛绒定制成本与工期估算系统 (FurZhiZhi / 毛织知)

sonar.projectKey=maorong-cost-estimation
sonar.projectName=毛绒定制成本与工期估算系统
sonar.projectVersion=1.0.0
sonar.sources=src
